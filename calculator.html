<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <table border="1">
            <tr>
                <td colspan="4">
                    <input type="text" id="InputBox" value="0" readonly aria-label="Calculator display" aria-live="polite"/>
                </td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(7)">7</td>
                <td onclick="digitBtnPressed(8)">8</td>
                <td onclick="digitBtnPressed(9)">9</td>
                <td onclick ="operatorBtnPressed('x')">x</td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(4)">4</td>
                <td onclick="digitBtnPressed(5)">5</td>
                <td onclick="digitBtnPressed(6)">6</td>
                <td onclick ="operatorBtnPressed('-')">-</td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(1)">1</td>
                <td onclick="digitBtnPressed(2)">2</td>
                <td onclick="digitBtnPressed(3)">3</td>
                <td onclick ="operatorBtnPressed('+')">+</td>
            </tr>
            <tr>
                <td onclick ="digitBtnPressed(0)" colspan="2">0</td>
                
                <td onclick="btnACpressed()">AC</td>
                <td onclick ="operatorBtnPressed('/')">/</td>
            </tr>
            <tr>
                <td onclick="equalsBtnPressed()" colspan="4">=</td>
            </tr>
        </table>
        
        <script>
            var newLine = true;
            var value1;
            var currentOperator;

            function clearActiveOperator(){
                document.querySelectorAll('td').forEach(function(td){ td.classList.remove('active-operator'); });
            }
            
            function digitBtnPressed(button){
                if(newLine){
                    document.getElementById("InputBox").value = button;
                    newLine = false;
                } else {
                    var currentValue = document.getElementById("InputBox").value;
                    document.getElementById("InputBox").value = currentValue + button;
                }
            }
            
            function btnACpressed(){
                clearActiveOperator();
                document.getElementById("InputBox").value = 0;
                currentOperator = undefined;
                newLine = true;
            }
            
            function operatorBtnPressed(operator){
                clearActiveOperator();
                currentOperator = operator;
                value1 = parseInt(document.getElementById("InputBox").value);
                newLine = true;
                if (window.event && window.event.currentTarget && window.event.currentTarget.tagName === 'TD') {
                    window.event.currentTarget.classList.add('active-operator');
                } else {
                    document.querySelectorAll('td').forEach(function(td){
                        if (td.getAttribute('onclick') && td.getAttribute('onclick').includes("'" + operator + "'")) {
                            td.classList.add('active-operator');
                        }
                    });
                }
            }
            
            function equalsBtnPressed(){
                if (!currentOperator) return;
                clearActiveOperator();
                var value2 = parseInt(document.getElementById("InputBox").value);
                var finalTotal;
                
                switch(currentOperator){
                    case "+": finalTotal = value1 + value2; break;
                    case "-": finalTotal = value1 - value2; break;
                    case "/": finalTotal = value1 / value2; break;
                    case "x": finalTotal = value1 * value2; break;
                }
                if (finalTotal !== undefined) document.getElementById("InputBox").value = finalTotal;
                value1 = 0;
                currentOperator = undefined;
                newLine = true;
            }

            document.addEventListener("DOMContentLoaded", function() {
                var labels = {'x':'multiply', '-':'subtract', '+':'add', '/':'divide', 'AC':'all clear', '=':'equals'};
                document.querySelectorAll("td[onclick]").forEach(function(td) {
                    td.setAttribute("tabindex", "0");
                    td.setAttribute("role", "button");
                    var txt = td.innerText.trim();
                    td.setAttribute("aria-label", labels[txt] || txt);
                    td.addEventListener("keydown", function(e) {
                        if (e.key === "Enter" || e.key === " ") {
                            e.preventDefault();
                            e.stopPropagation();
                            td.click();
                        }
                    });
                });

                var keyMap = {'*':'x', 'x':'x', '-':'-', '+':'+', '/':'/', 'Enter':'=', '=':'=', 'Escape':'AC'};
                window.addEventListener("keydown", function(e) {
                    if (e.target.tagName === "INPUT") return;
                    var key = keyMap[e.key] || e.key;
                    if (!isNaN(key) && key !== " ") {
                        digitBtnPressed(parseInt(key));
                    } else if (['x', '-', '+', '/'].includes(key)) {
                        operatorBtnPressed(key);
                    } else if (key === '=') {
                        equalsBtnPressed();
                    } else if (key === 'AC') {
                        btnACpressed();
                    }
                });
            });
        </script>
    
    </body>
</html>
