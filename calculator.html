<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <table border="1">
            <tr>
                <td colspan="4">
                    <input type="text" id="InputBox" value="0" readonly aria-live="polite" aria-label="Calculator Display"/>
                </td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(7)" role="button" tabindex="0">7</td>
                <td onclick="digitBtnPressed(8)" role="button" tabindex="0">8</td>
                <td onclick="digitBtnPressed(9)" role="button" tabindex="0">9</td>
                <td onclick="operatorBtnPressed('x')" role="button" tabindex="0" aria-label="multiply">x</td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(4)" role="button" tabindex="0">4</td>
                <td onclick="digitBtnPressed(5)" role="button" tabindex="0">5</td>
                <td onclick="digitBtnPressed(6)" role="button" tabindex="0">6</td>
                <td onclick="operatorBtnPressed('-')" role="button" tabindex="0" aria-label="subtract">-</td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(1)" role="button" tabindex="0">1</td>
                <td onclick="digitBtnPressed(2)" role="button" tabindex="0">2</td>
                <td onclick="digitBtnPressed(3)" role="button" tabindex="0">3</td>
                <td onclick="operatorBtnPressed('+')" role="button" tabindex="0" aria-label="add">+</td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(0)" colspan="2" role="button" tabindex="0">0</td>
                <td onclick="btnACpressed()" role="button" tabindex="0" aria-label="all clear">AC</td>
                <td onclick="operatorBtnPressed('/')" role="button" tabindex="0" aria-label="divide">/</td>
            </tr>
            <tr>
                <td onclick="equalsBtnPressed()" colspan="4" role="button" tabindex="0" aria-label="equals">=</td>
            </tr>
        </table>
        
        <script>
            var newLine = true; //Boolean variable. Determines if the next thing user types should be on a new line
            var value1;
            var currentOperator;

            // Add event listeners for keyboard accessibility on buttons
            document.querySelectorAll('td[role="button"]').forEach(btn => {
                btn.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        e.stopPropagation();
                        this.click();
                    }
                });
            });

            // Global keyboard support
            window.addEventListener('keydown', function(e) {
                if (e.key >= '0' && e.key <= '9') {
                    digitBtnPressed(parseInt(e.key));
                } else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
                    var op = e.key === '*' ? 'x' : e.key;
                    operatorBtnPressed(op);
                } else if (e.key === 'Enter') {
                    equalsBtnPressed();
                } else if (e.key === 'Escape') {
                    btnACpressed();
                }
            });
            
            //Event handler for when any digit button is pressed
            function digitBtnPressed(button){
                
                if(newLine){
                    document.getElementById("InputBox").value = button;
                    newLine = false;
                } else {
                    var currentValue = document.getElementById("InputBox").value;
                    document.getElementById("InputBox").value = currentValue + button;
                }
            }
            
            //Event handler for when the AC button is pressed
            function btnACpressed(){
                document.getElementById("InputBox").value = 0;
                newLine = true;
            }
            
            function operatorBtnPressed(operator){
                currentOperator = operator;
                value1= parseInt(document.getElementById("InputBox").value);
                newLine = true;
            }
            
            //Event handler for equals to button
            function equalsBtnPressed(){
                var value2 = parseInt(document.getElementById("InputBox").value);
                var finalTotal;
                
                switch(currentOperator){
                        case "+":
                            finalTotal = value1 + value2;
                            break;
                        case "-":
                            finalTotal = value1 - value2;
                            break;
                        case "/":
                            finalTotal = value1 / value2;
                            break;
                        case "x":
                            finalTotal = value1 * value2;
                            break;
                        
                }
                document.getElementById("InputBox").value = finalTotal;
                value1 = 0;
                newLine = true;
            }
        </script>
    
    </body>
</html>
