<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <table border="1">
            <tr>
                <td colspan="4">
                    <input type="text" id="InputBox" value="0" readonly aria-label="Calculator display" aria-live="polite"/>
                </td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(7)">7</td>
                <td onclick="digitBtnPressed(8)">8</td>
                <td onclick="digitBtnPressed(9)">9</td>
                <td onclick ="operatorBtnPressed('x')">x</td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(4)">4</td>
                <td onclick="digitBtnPressed(5)">5</td>
                <td onclick="digitBtnPressed(6)">6</td>
                <td onclick ="operatorBtnPressed('-')">-</td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(1)">1</td>
                <td onclick="digitBtnPressed(2)">2</td>
                <td onclick="digitBtnPressed(3)">3</td>
                <td onclick ="operatorBtnPressed('+')">+</td>
            </tr>
            <tr>
                <td onclick ="digitBtnPressed(0)" colspan="2">0</td>
                
                <td onclick="btnACpressed()">AC</td>
                <td onclick ="operatorBtnPressed('/')">/</td>
            </tr>
            <tr>
                <td onclick="equalsBtnPressed()" colspan="4">=</td>
            </tr>
        </table>
        
        <script>
            var newLine = true; //Boolean variable. Determines if the next thing user types should be on a new line
            var value1;
            var currentOperator;
            
            //Event handler for when any digit button is pressed
            function digitBtnPressed(button){
                
                if(newLine){
                    document.getElementById("InputBox").value = button;
                    newLine = false;
                } else {
                    var currentValue = document.getElementById("InputBox").value;
                    document.getElementById("InputBox").value = currentValue + button;
                }
            }
            
            function clearActiveOperator(){
                document.querySelectorAll("td[onclick*='operatorBtnPressed']").forEach(function(td){
                    td.classList.remove("active-operator");
                    td.removeAttribute("aria-pressed");
                });
            }

            //Event handler for when the AC button is pressed
            function btnACpressed(){
                document.getElementById("InputBox").value = 0;
                newLine = true;
                currentOperator = undefined;
                clearActiveOperator();
            }
            
            function operatorBtnPressed(operator){
                clearActiveOperator();
                currentOperator = operator;
                value1= parseInt(document.getElementById("InputBox").value);
                newLine = true;
                var opEl = Array.from(document.querySelectorAll("td[onclick*='operatorBtnPressed']")).find(function(td){ return td.innerText.trim() === operator; });
                if(opEl){ opEl.classList.add("active-operator"); opEl.setAttribute("aria-pressed", "true"); }
            }
            
            //Event handler for equals to button
            function equalsBtnPressed(){
                if(!currentOperator) return;
                var value2 = parseInt(document.getElementById("InputBox").value);
                var finalTotal;
                
                switch(currentOperator){
                        case "+":
                            finalTotal = value1 + value2;
                            break;
                        case "-":
                            finalTotal = value1 - value2;
                            break;
                        case "/":
                            finalTotal = value1 / value2;
                            break;
                        case "x":
                            finalTotal = value1 * value2;
                            break;
                        
                }
                if(finalTotal !== undefined) document.getElementById("InputBox").value = finalTotal;
                value1 = 0;
                currentOperator = undefined;
                clearActiveOperator();
                newLine = true;
            }

            document.addEventListener("DOMContentLoaded", function(){
                var labels = {'+':'plus','-':'minus','x':'multiply','/':'divide','=':'equals','AC':'all clear'};
                document.querySelectorAll("td[onclick]").forEach(function(td){
                    td.setAttribute("role", "button");
                    td.setAttribute("tabindex", "0");
                    var txt = td.innerText.trim();
                    if(labels[txt]) td.setAttribute("aria-label", labels[txt]);
                    td.addEventListener("keydown", function(e){
                        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); e.stopPropagation(); td.click(); }
                    });
                });
                window.addEventListener("keydown", function(e){
                    if(e.key >= "0" && e.key <= "9"){
                        var digitEl = Array.from(document.querySelectorAll("td[onclick*='digitBtnPressed']")).find(function(td){ return td.innerText.trim() === e.key; });
                        if(digitEl) digitEl.click();
                    } else {
                        var keyMap = {'*':'x','x':'x','-':'-','+':'+','/':'/','Enter':'=','=':'=','Escape':'AC'};
                        var mapped = keyMap[e.key];
                        if(mapped){
                            e.preventDefault();
                            var target = Array.from(document.querySelectorAll("td[onclick]")).find(function(td){ return td.innerText.trim() === mapped; });
                            if(target) target.click();
                        }
                    }
                });
            });
        </script>
    
    </body>
</html>
