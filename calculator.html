<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <table border="1">
            <tr>
                <td colspan="4">
                    <input type="text" id="InputBox" value="0" readonly aria-live="polite" aria-label="Calculator display"/>
                </td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(7)">7</td>
                <td onclick="digitBtnPressed(8)">8</td>
                <td onclick="digitBtnPressed(9)">9</td>
                <td onclick ="operatorBtnPressed('x')">x</td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(4)">4</td>
                <td onclick="digitBtnPressed(5)">5</td>
                <td onclick="digitBtnPressed(6)">6</td>
                <td onclick ="operatorBtnPressed('-')">-</td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(1)">1</td>
                <td onclick="digitBtnPressed(2)">2</td>
                <td onclick="digitBtnPressed(3)">3</td>
                <td onclick ="operatorBtnPressed('+')">+</td>
            </tr>
            <tr>
                <td onclick ="digitBtnPressed(0)" colspan="2">0</td>
                
                <td onclick="btnACpressed()">AC</td>
                <td onclick ="operatorBtnPressed('/')">/</td>
            </tr>
            <tr>
                <td onclick="equalsBtnPressed()" colspan="4">=</td>
            </tr>
        </table>
        
        <script>
            var newLine = true; //Boolean variable. Determines if the next thing user types should be on a new line
            var value1;
            var currentOperator;
            
            //Event handler for when any digit button is pressed
            function digitBtnPressed(button){
                
                if(newLine){
                    document.getElementById("InputBox").value = button;
                    newLine = false;
                } else {
                    var currentValue = document.getElementById("InputBox").value;
                    document.getElementById("InputBox").value = currentValue + button;
                }
            }
            
            //Event handler for when the AC button is pressed
            function btnACpressed(){
                document.getElementById("InputBox").value = 0;
                newLine = true;
            }
            
            function operatorBtnPressed(operator){
                currentOperator = operator;
                value1= parseInt(document.getElementById("InputBox").value);
                newLine = true;
            }
            
            //Event handler for equals to button
            function equalsBtnPressed(){
                if (!currentOperator) return;
                var value2 = parseInt(document.getElementById("InputBox").value);
                var finalTotal;
                
                switch(currentOperator){
                        case "+":
                            finalTotal = value1 + value2;
                            break;
                        case "-":
                            finalTotal = value1 - value2;
                            break;
                        case "/":
                            finalTotal = value1 / value2;
                            break;
                        case "x":
                            finalTotal = value1 * value2;
                            break;
                        
                }
                if (finalTotal !== undefined) {
                    document.getElementById("InputBox").value = finalTotal;
                }
                value1 = 0;
                currentOperator = undefined;
                newLine = true;
            }

            document.addEventListener("DOMContentLoaded", function() {
                var buttons = document.querySelectorAll("td[onclick]");
                var labels = {"+": "add", "-": "subtract", "x": "multiply", "/": "divide", "=": "equals", "AC": "all clear"};
                buttons.forEach(function(btn) {
                    btn.setAttribute("tabindex", "0");
                    btn.setAttribute("role", "button");
                    var txt = btn.textContent.trim();
                    btn.setAttribute("aria-label", labels[txt] || txt);
                    btn.addEventListener("keydown", function(e) {
                        if (e.key === "Enter" || e.key === " ") {
                            e.preventDefault();
                            e.stopPropagation();
                            btn.click();
                        }
                    });
                });

                window.addEventListener("keydown", function(e) {
                    if (document.activeElement && document.activeElement.tagName === "TD") {
                        // Let focused button handle physical keypresses if they press Enter or Space to avoid double execution
                        if (e.key === "Enter" || e.key === " ") {
                            return;
                        }
                    }
                    var keyMap = {
                        "0": function() { digitBtnPressed(0); },
                        "1": function() { digitBtnPressed(1); },
                        "2": function() { digitBtnPressed(2); },
                        "3": function() { digitBtnPressed(3); },
                        "4": function() { digitBtnPressed(4); },
                        "5": function() { digitBtnPressed(5); },
                        "6": function() { digitBtnPressed(6); },
                        "7": function() { digitBtnPressed(7); },
                        "8": function() { digitBtnPressed(8); },
                        "9": function() { digitBtnPressed(9); },
                        "+": function() { operatorBtnPressed("+"); },
                        "-": function() { operatorBtnPressed("-"); },
                        "*": function() { operatorBtnPressed("x"); },
                        "x": function() { operatorBtnPressed("x"); },
                        "/": function() { operatorBtnPressed("/"); },
                        "Enter": function() { equalsBtnPressed(); },
                        "=": function() { equalsBtnPressed(); },
                        "Escape": function() { btnACpressed(); }
                    };
                    if (keyMap[e.key]) {
                        e.preventDefault();
                        keyMap[e.key]();
                    }
                });
            });
        </script>
    
    </body>
</html>
