<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <table border="1">
            <tr>
                <td colspan="4">
                    <input type="text" id="InputBox" value="0" readonly aria-label="Calculator display" aria-live="polite"/>
                </td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(7)">7</td>
                <td onclick="digitBtnPressed(8)">8</td>
                <td onclick="digitBtnPressed(9)">9</td>
                <td onclick="operatorBtnPressed('x')" aria-label="multiply">x</td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(4)">4</td>
                <td onclick="digitBtnPressed(5)">5</td>
                <td onclick="digitBtnPressed(6)">6</td>
                <td onclick="operatorBtnPressed('-')" aria-label="subtract">-</td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(1)">1</td>
                <td onclick="digitBtnPressed(2)">2</td>
                <td onclick="digitBtnPressed(3)">3</td>
                <td onclick="operatorBtnPressed('+')" aria-label="add">+</td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(0)" colspan="2">0</td>
                <td onclick="btnACpressed()" aria-label="all clear">AC</td>
                <td onclick="operatorBtnPressed('/')" aria-label="divide">/</td>
            </tr>
            <tr>
                <td onclick="equalsBtnPressed()" colspan="4" aria-label="equals">=</td>
            </tr>
        </table>
        
        <script>
            var newLine = true;
            var value1;
            var currentOperator;
            
            function digitBtnPressed(button){
                if(newLine){
                    document.getElementById("InputBox").value = button;
                    newLine = false;
                } else {
                    var currentValue = document.getElementById("InputBox").value;
                    document.getElementById("InputBox").value = currentValue + button;
                }
            }
            
            function btnACpressed(){
                document.getElementById("InputBox").value = 0;
                newLine = true;
                currentOperator = undefined;
            }
            
            function operatorBtnPressed(operator){
                currentOperator = operator;
                value1= parseInt(document.getElementById("InputBox").value);
                newLine = true;
            }
            
            function equalsBtnPressed(){
                if(!currentOperator) return;
                var value2 = parseInt(document.getElementById("InputBox").value);
                var finalTotal;
                
                switch(currentOperator){
                    case "+": finalTotal = value1 + value2; break;
                    case "-": finalTotal = value1 - value2; break;
                    case "/": finalTotal = value1 / value2; break;
                    case "x": finalTotal = value1 * value2; break;
                }
                document.getElementById("InputBox").value = finalTotal;
                value1 = 0;
                currentOperator = undefined;
                newLine = true;
            }

            document.addEventListener('DOMContentLoaded', function() {
                document.querySelectorAll('td[onclick]').forEach(function(btn) {
                    btn.setAttribute('tabindex', '0');
                    btn.setAttribute('role', 'button');
                    btn.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            e.stopPropagation();
                            btn.click();
                        }
                    });
                });
            });

            window.addEventListener('keydown', function(e) {
                var map = {'*':'x','x':'x','-':'-','+':'+','/':'/','Enter':'=','=':'=','Escape':'AC'};
                if (e.key >= '0' && e.key <= '9') digitBtnPressed(parseInt(e.key));
                else if (map[e.key]) {
                    var op = map[e.key];
                    if (op === 'AC') btnACpressed();
                    else if (op === '=') equalsBtnPressed();
                    else operatorBtnPressed(op);
                }
            });
        </script>
    </body>
</html>
