<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <table border="1">
            <tr>
                <td colspan="4">
                    <input type="text" id="InputBox" value="0" readonly aria-label="Calculator display"/>
                </td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(7)">7</td>
                <td onclick="digitBtnPressed(8)">8</td>
                <td onclick="digitBtnPressed(9)">9</td>
                <td onclick ="operatorBtnPressed('x')">x</td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(4)">4</td>
                <td onclick="digitBtnPressed(5)">5</td>
                <td onclick="digitBtnPressed(6)">6</td>
                <td onclick ="operatorBtnPressed('-')">-</td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(1)">1</td>
                <td onclick="digitBtnPressed(2)">2</td>
                <td onclick="digitBtnPressed(3)">3</td>
                <td onclick ="operatorBtnPressed('+')">+</td>
            </tr>
            <tr>
                <td onclick ="digitBtnPressed(0)" colspan="2">0</td>
                
                <td onclick="btnACpressed()">AC</td>
                <td onclick ="operatorBtnPressed('/')">/</td>
            </tr>
            <tr>
                <td onclick="equalsBtnPressed()" colspan="4">=</td>
            </tr>
        </table>
        
        <script>
            let newLine = true, value1, currentOperator;
            const display = document.getElementById("InputBox");
            function digitBtnPressed(n) { display.value = newLine ? n : display.value + n; newLine = false; }
            function btnACpressed() { display.value = 0; newLine = true; value1 = undefined; currentOperator = undefined; }
            function operatorBtnPressed(op) { currentOperator = op; value1 = parseFloat(display.value); newLine = true; }
            function equalsBtnPressed() {
                if (!currentOperator) return;
                const v2 = parseFloat(display.value);
                let res = currentOperator === '+' ? value1 + v2 : currentOperator === '-' ? value1 - v2 :
                          currentOperator === 'x' ? value1 * v2 : value1 / v2;
                display.value = res; value1 = res; currentOperator = undefined; newLine = true;
            }
            document.querySelectorAll('td[onclick]').forEach(btn => {
                btn.setAttribute('role', 'button'); btn.setAttribute('tabindex', '0');
                const labels = { 'x': 'multiply', '-': 'subtract', '+': 'add', '/': 'divide', 'AC': 'all clear', '=': 'equals' };
                btn.setAttribute('aria-label', labels[btn.innerText] || btn.innerText);
                btn.onkeydown = e => { if (['Enter', ' '].includes(e.key)) { e.preventDefault(); e.stopPropagation(); btn.click(); } };
            });
            document.onkeydown = e => {
                if (e.key >= '0' && e.key <= '9') digitBtnPressed(e.key);
                else if (['+', '-', '/', '*'].includes(e.key)) operatorBtnPressed(e.key === '*' ? 'x' : e.key);
                else if (e.key === 'Enter' || e.key === '=') equalsBtnPressed();
                else if (e.key === 'Escape') btnACpressed();
            };
        </script>
    
    </body>
</html>
