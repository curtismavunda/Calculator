<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Calculator</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <table border="1">
            <tr>
                <td colspan="4">
                    <input type="text" id="InputBox" value="0" readonly aria-live="polite" aria-label="Calculator display"/>
                </td>
            </tr>
            <tr>
                <td tabindex="0" role="button" aria-label="7" onclick="digitBtnPressed(7)">7</td>
                <td tabindex="0" role="button" aria-label="8" onclick="digitBtnPressed(8)">8</td>
                <td tabindex="0" role="button" aria-label="9" onclick="digitBtnPressed(9)">9</td>
                <td tabindex="0" role="button" aria-label="multiply" onclick="operatorBtnPressed('x')">x</td>
            </tr>
            <tr>
                <td tabindex="0" role="button" aria-label="4" onclick="digitBtnPressed(4)">4</td>
                <td tabindex="0" role="button" aria-label="5" onclick="digitBtnPressed(5)">5</td>
                <td tabindex="0" role="button" aria-label="6" onclick="digitBtnPressed(6)">6</td>
                <td tabindex="0" role="button" aria-label="subtract" onclick="operatorBtnPressed('-')">-</td>
            </tr>
            <tr>
                <td tabindex="0" role="button" aria-label="1" onclick="digitBtnPressed(1)">1</td>
                <td tabindex="0" role="button" aria-label="2" onclick="digitBtnPressed(2)">2</td>
                <td tabindex="0" role="button" aria-label="3" onclick="digitBtnPressed(3)">3</td>
                <td tabindex="0" role="button" aria-label="add" onclick="operatorBtnPressed('+')">+</td>
            </tr>
            <tr>
                <td tabindex="0" role="button" aria-label="0" onclick="digitBtnPressed(0)" colspan="2">0</td>
                <td tabindex="0" role="button" aria-label="all clear" onclick="btnACpressed()">AC</td>
                <td tabindex="0" role="button" aria-label="divide" onclick="operatorBtnPressed('/')">/</td>
            </tr>
            <tr>
                <td tabindex="0" role="button" aria-label="equals" onclick="equalsBtnPressed()" colspan="4">=</td>
            </tr>
        </table>
        
        <script>
            var newLine = true; //Boolean variable. Determines if the next thing user types should be on a new line
            var value1;
            var currentOperator;
            
            document.addEventListener('DOMContentLoaded', function() {
                var buttons = document.querySelectorAll('td[role="button"]');
                buttons.forEach(function(button) {
                    button.addEventListener('keydown', function(event) {
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            event.stopPropagation();
                            button.click();
                        }
                    });
                });
            });

            //Event handler for when any digit button is pressed
            function digitBtnPressed(button){
                
                if(newLine){
                    document.getElementById("InputBox").value = button;
                    newLine = false;
                } else {
                    var currentValue = document.getElementById("InputBox").value;
                    document.getElementById("InputBox").value = currentValue + button;
                }
            }
            
            //Event handler for when the AC button is pressed
            function btnACpressed(){
                document.getElementById("InputBox").value = 0;
                newLine = true;
            }
            
            function operatorBtnPressed(operator){
                currentOperator = operator;
                value1= parseInt(document.getElementById("InputBox").value);
                newLine = true;
            }
            
            //Event handler for equals to button
            function equalsBtnPressed(){
                var value2 = parseInt(document.getElementById("InputBox").value);
                var finalTotal;
                
                switch(currentOperator){
                        case "+":
                            finalTotal = value1 + value2;
                            break;
                        case "-":
                            finalTotal = value1 - value2;
                            break;
                        case "/":
                            finalTotal = value1 / value2;
                            break;
                        case "x":
                            finalTotal = value1 * value2;
                            break;
                        
                }
                document.getElementById("InputBox").value = finalTotal;
                value1 = 0;
                newLine = true;
            }
        </script>
    
    </body>
</html>
