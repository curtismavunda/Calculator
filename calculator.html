<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Calculator</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <table border="1">
            <tr>
                <td colspan="4">
                    <input type="text" id="InputBox" value="0" readonly aria-label="Calculator display" aria-live="polite"/>
                </td>
            </tr>
            <tr>
                <td role="button" tabindex="0" aria-label="7" onclick="digitBtnPressed(7)">7</td>
                <td role="button" tabindex="0" aria-label="8" onclick="digitBtnPressed(8)">8</td>
                <td role="button" tabindex="0" aria-label="9" onclick="digitBtnPressed(9)">9</td>
                <td role="button" tabindex="0" aria-label="multiply" onclick="operatorBtnPressed('x')">x</td>
            </tr>
            <tr>
                <td role="button" tabindex="0" aria-label="4" onclick="digitBtnPressed(4)">4</td>
                <td role="button" tabindex="0" aria-label="5" onclick="digitBtnPressed(5)">5</td>
                <td role="button" tabindex="0" aria-label="6" onclick="digitBtnPressed(6)">6</td>
                <td role="button" tabindex="0" aria-label="subtract" onclick="operatorBtnPressed('-')">-</td>
            </tr>
            <tr>
                <td role="button" tabindex="0" aria-label="1" onclick="digitBtnPressed(1)">1</td>
                <td role="button" tabindex="0" aria-label="2" onclick="digitBtnPressed(2)">2</td>
                <td role="button" tabindex="0" aria-label="3" onclick="digitBtnPressed(3)">3</td>
                <td role="button" tabindex="0" aria-label="add" onclick="operatorBtnPressed('+')">+</td>
            </tr>
            <tr>
                <td role="button" tabindex="0" aria-label="0" onclick="digitBtnPressed(0)" colspan="2">0</td>
                <td role="button" tabindex="0" aria-label="all clear" onclick="btnACpressed()">AC</td>
                <td role="button" tabindex="0" aria-label="divide" onclick="operatorBtnPressed('/')">/</td>
            </tr>
            <tr>
                <td role="button" tabindex="0" aria-label="equals" onclick="equalsBtnPressed()" colspan="4">=</td>
            </tr>
        </table>
        
        <script>
            var newLine = true; //Boolean variable. Determines if the next thing user types should be on a new line
            var value1;
            var currentOperator;
            
            //Event handler for when any digit button is pressed
            function digitBtnPressed(button){
                if(newLine){
                    document.getElementById("InputBox").value = button;
                    newLine = false;
                } else {
                    var currentValue = document.getElementById("InputBox").value;
                    document.getElementById("InputBox").value = currentValue + button;
                }
            }
            
            //Event handler for when the AC button is pressed
            function btnACpressed(){
                document.getElementById("InputBox").value = 0;
                newLine = true;
            }
            
            function operatorBtnPressed(operator){
                currentOperator = operator;
                value1 = parseInt(document.getElementById("InputBox").value);
                newLine = true;
            }
            
            //Event handler for equals to button
            function equalsBtnPressed(){
                if (!currentOperator) return;
                var value2 = parseInt(document.getElementById("InputBox").value);
                var finalTotal;
                
                switch(currentOperator){
                    case "+":
                        finalTotal = value1 + value2;
                        break;
                    case "-":
                        finalTotal = value1 - value2;
                        break;
                    case "/":
                        finalTotal = value1 / value2;
                        break;
                    case "x":
                        finalTotal = value1 * value2;
                        break;
                }
                if (finalTotal !== undefined) {
                    document.getElementById("InputBox").value = finalTotal;
                }
                value1 = 0;
                currentOperator = undefined;
                newLine = true;
            }

            document.addEventListener("DOMContentLoaded", function() {
                var buttons = document.querySelectorAll("td[role='button']");
                buttons.forEach(function(btn) {
                    btn.addEventListener("keydown", function(e) {
                        if (e.key === "Enter" || e.key === " ") {
                            e.preventDefault();
                            e.stopPropagation();
                            btn.click();
                        }
                    });
                });

                var keyMap = {'*':'x','x':'x','-':'-','+':'+','/':'/','Enter':'=','=':'=','Escape':'AC'};
                window.addEventListener("keydown", function(e) {
                    if (e.target.tagName === 'INPUT') return;
                    if (e.key >= '0' && e.key <= '9') {
                        digitBtnPressed(parseInt(e.key));
                    } else if (keyMap[e.key]) {
                        var op = keyMap[e.key];
                        if (op === '=') equalsBtnPressed();
                        else if (op === 'AC') btnACpressed();
                        else operatorBtnPressed(op);
                    }
                });
            });
        </script>
    </body>
</html>
