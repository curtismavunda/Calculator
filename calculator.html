<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <table border="1">
            <tr>
                <td colspan="4">
                    <input type="text" id="InputBox" value="0" readonly aria-label="Calculator display" aria-live="polite"/>
                </td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(7)">7</td>
                <td onclick="digitBtnPressed(8)">8</td>
                <td onclick="digitBtnPressed(9)">9</td>
                <td onclick ="operatorBtnPressed('x')">x</td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(4)">4</td>
                <td onclick="digitBtnPressed(5)">5</td>
                <td onclick="digitBtnPressed(6)">6</td>
                <td onclick ="operatorBtnPressed('-')">-</td>
            </tr>
            <tr>
                <td onclick="digitBtnPressed(1)">1</td>
                <td onclick="digitBtnPressed(2)">2</td>
                <td onclick="digitBtnPressed(3)">3</td>
                <td onclick ="operatorBtnPressed('+')">+</td>
            </tr>
            <tr>
                <td onclick ="digitBtnPressed(0)" colspan="2">0</td>
                
                <td onclick="btnACpressed()">AC</td>
                <td onclick ="operatorBtnPressed('/')">/</td>
            </tr>
            <tr>
                <td onclick="equalsBtnPressed()" colspan="4">=</td>
            </tr>
        </table>
        
        <script>
            var newLine = true, value1, currentOperator;

            document.addEventListener('DOMContentLoaded', function() {
                document.querySelectorAll('td[onclick]').forEach(function(btn) {
                    btn.setAttribute('role', 'button');
                    btn.setAttribute('tabindex', '0');
                    var text = btn.innerText.trim();
                    var labels = {'x':'multiply','/':'divide','+':'add','-':'subtract','AC':'all clear','=':'equals'};
                    btn.setAttribute('aria-label', labels[text] || text);
                    btn.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault(); e.stopPropagation(); btn.click();
                        }
                    });
                });

                window.addEventListener('keydown', function(e) {
                    if (e.key >= '0' && e.key <= '9') digitBtnPressed(e.key);
                    else if (e.key === '+') operatorBtnPressed('+');
                    else if (e.key === '-') operatorBtnPressed('-');
                    else if (e.key === '*') operatorBtnPressed('x');
                    else if (e.key === '/') operatorBtnPressed('/');
                    else if (e.key === 'Enter' || e.key === '=') equalsBtnPressed();
                    else if (e.key === 'Escape') btnACpressed();
                });
            });
            
            function digitBtnPressed(button){
                var input = document.getElementById("InputBox");
                if(newLine){
                    input.value = button;
                    newLine = false;
                } else {
                    input.value += button;
                }
            }
            
            function btnACpressed(){
                document.getElementById("InputBox").value = 0;
                newLine = true;
            }
            
            function operatorBtnPressed(operator){
                currentOperator = operator;
                value1 = parseFloat(document.getElementById("InputBox").value);
                newLine = true;
            }
            
            function equalsBtnPressed(){
                if (!currentOperator) return;
                var value2 = parseFloat(document.getElementById("InputBox").value);
                var finalTotal;
                switch(currentOperator){
                    case "+": finalTotal = value1 + value2; break;
                    case "-": finalTotal = value1 - value2; break;
                    case "/": finalTotal = value1 / value2; break;
                    case "x": finalTotal = value1 * value2; break;
                }
                document.getElementById("InputBox").value = finalTotal;
                currentOperator = undefined;
                newLine = true;
            }
        </script>
    </body>
</html>
